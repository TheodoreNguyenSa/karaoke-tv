<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; background:#000; width:100%; height:100%; overflow:hidden; }
  #player { position:absolute; left:0; top:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Official YouTube IFrame Player API host page. The Android side drives
  // it through window.karaoke* functions and receives events back through
  // the KaraokeBridge JavascriptInterface. Ads are YouTube's own and are
  // left completely untouched; nothing is downloaded or cached here.
  var player = null;
  var ready = false;
  var pendingVideo = null;
  var kickTimer = null;

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function bridge(name, a, b) {
    try {
      if (window.KaraokeBridge && window.KaraokeBridge[name]) {
        window.KaraokeBridge[name](a, b);
      }
    } catch (e) { }
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      // Privacy-enhanced embed host: the standard www.youtube.com embed
      // host refused every video in this WebView with error 152, so the
      // player iframe is served from youtube-nocookie instead. The
      // Hosted copy (GitHub Pages): this page's real origin is the
      // github.io origin named in the 'origin' playerVar below.
      width: '100%',
      height: '100%',
      playerVars: {
        autoplay: 0,
        controls: 0,
        origin: 'https://theodorenguyensa.github.io',
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        iv_load_policy: 3,
        fs: 0,
        disablekb: 1
      },
      events: {
        onReady: function () {
          ready = true;
          bridge('onPlayerReady');
          if (pendingVideo) {
            var v = pendingVideo; pendingVideo = null;
            karaokeLoad(v);
          }
          setInterval(function () {
            try {
              if (player && player.getCurrentTime) {
                bridge('onPlayerProgress', player.getCurrentTime(), player.getDuration());
              }
            } catch (e) { }
          }, 1000);
        },
        onStateChange: function (ev) {
          bridge('onPlayerState', ev.data);
          try {
            // Audible autoplay is blocked in a fresh WebView profile, so
            // songs start muted (muted autoplay is always allowed) and
            // un-mute as soon as real playback begins.
            if (ev.data === 1 && player && player.isMuted && player.isMuted()) {
              player.unMute();
              if (player.setVolume) player.setVolume(100);
            }
            if (ev.data === 5 && player) { player.playVideo(); }
          } catch (e) { }
        },
        onError: function (ev) { stopKickPoll(); bridge('onPlayerError', ev.data); }
      }
    });
  }

  // Autoplay kick (v1.0.4): after a load, some WebView contexts
  // leave the player CUED / UNSTARTED / PAUSED behind the embed's
  // tap-to-play poster even though loadVideoById should autoplay.
  // Poll once a second for up to 15 s and re-issue playVideo()
  // while the player sits in one of those states; stop as soon as
  // it is PLAYING (the state handler un-mutes) or ENDED, or on
  // error. The native side adds a real centre tap as a second
  // layer for the poster case.
  function startKickPoll() {
    stopKickPoll();
    var tries = 0;
    kickTimer = setInterval(function () {
      tries++;
      try {
        if (player && player.getPlayerState) {
          var st = player.getPlayerState();
          if (st === 1 || st === 0) { stopKickPoll(); return; }
          if (st === 5 || st === -1 || st === 2) { player.playVideo(); }
        }
      } catch (e) { }
      if (tries >= 15) stopKickPoll();
    }, 1000);
  }
  function stopKickPoll() {
    if (kickTimer) { clearInterval(kickTimer); kickTimer = null; }
  }

  function karaokeLoad(vid) {
    if (!ready || !player) { pendingVideo = vid; return; }
    try {
      if (player.mute) player.mute();
      player.loadVideoById(vid);
      startKickPoll();
    } catch (e) { bridge('onPlayerError', -1); }
  }
  function karaokePlay() { try { player.playVideo(); } catch (e) { } }
  function karaokePause() { try { player.pauseVideo(); } catch (e) { } }
  function karaokeStop() { stopKickPoll(); try { player.stopVideo(); } catch (e) { } }
</script>
</body>
</html>
